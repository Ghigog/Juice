# Build APK for testing
#
# Builds the Juice debug APK so it can be installed on a Pixel without a local
# Android toolchain. Runs on every push to main and can be started by hand.
#
# HOW TO GET THE APK (on GitHub, in a browser):
#   1. Open the repository's "Actions" tab.
#   2. Click "Build APK for testing" in the left-hand list, then click the
#      newest run (green tick). To build the current code on demand, click
#      "Run workflow" (top right of the run list) first and wait ~5 minutes.
#   3. Scroll to the bottom of the run page to the "Artifacts" section and
#      click "juice-debug-apk". That downloads juice-debug-apk.zip.
#   4. Unzip it. Inside is app-debug.apk.
#
# HOW TO INSTALL ON A PIXEL:
#   1. Get app-debug.apk onto the phone (download the zip on the phone and
#      unzip it with Files, or copy the unzipped APK over USB / Drive).
#   2. Tap the APK. When Android asks, allow your browser/Files app to
#      "Install unknown apps", then tap Install.
#   (Or, with USB debugging on:  adb install -r app-debug.apk)
#   Testing is scoped to Pixel devices only.
name: Build APK for testing

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: juice-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
