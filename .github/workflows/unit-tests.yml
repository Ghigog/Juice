# Unit tests
#
# Runs the :core tests and the :app debug unit tests once (not the release variant) and verifies the coverage
# floors, then, in a second job, runs lint, compiles the androidTest sources and compiles release Kotlin
# on each push to main and each pull request,
# so a broken test build or release-only code can't reach main unnoticed.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests and verify coverage
        run: ./gradlew :core:test :app:testDebugUnitTest koverVerifyCi

  lint-and-android-test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run lint and compile instrumented tests and release
        run: ./gradlew :app:lintDebug :app:compileDebugAndroidTestKotlin :app:compileReleaseKotlin
