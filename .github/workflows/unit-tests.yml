# Unit tests
#
# Compiles and runs every debug unit test, runs lint and compiles the androidTest sources
# on each push to main and each pull request,
# so a broken test build can't reach main unnoticed.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run debug unit tests and verify coverage
        run: ./gradlew :app:testDebugUnitTest :core:test koverVerify

  lint-and-android-test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run lint and compile instrumented tests
        run: ./gradlew :app:lintDebug :app:compileDebugAndroidTestKotlin
