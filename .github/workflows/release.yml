# Publish a signed release APK to GitHub Releases when a version tag (v*) is pushed.
# See docs/releasing.md.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches versionName
        run: |
          version_name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
          if [ "${GITHUB_REF_NAME#v}" != "$version_name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version_name in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JUICE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::JUICE_KEYSTORE_BASE64 is not set; refusing to sign a release with the debug keystore"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/juice-release.jks"
          echo "JUICE_KEYSTORE_FILE=$RUNNER_TEMP/juice-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          JUICE_KEYSTORE_PASSWORD: ${{ secrets.JUICE_KEYSTORE_PASSWORD }}
          JUICE_KEY_ALIAS: ${{ secrets.JUICE_KEY_ALIAS }}
          JUICE_KEY_PASSWORD: ${{ secrets.JUICE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "juice-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" --generate-notes "juice-$GITHUB_REF_NAME.apk"
